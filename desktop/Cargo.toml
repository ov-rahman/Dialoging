[package]
name = "dialoging"
version = "0.1.0"
edition = "2021"
description = "Редактор диалогов с разметкой в духе движка Undertale"
license = "MIT"

[dependencies]
# Рендерер glow (OpenGL), а не wgpu по умолчанию: под Xvfb с программным Mesa
# он заводится предсказуемо, а на Windows одинаково хорош.
eframe = { version = "0.36.1", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = "0.36.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
