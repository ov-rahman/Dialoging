name: desktop

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

jobs:
  # Логика проверяется без экрана: сериализация, каретка, разбор значений.
  test:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libxkbcommon-dev libgl1-mesa-dev libx11-dev

      - name: Rust stable
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ubuntu-cargo-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: ubuntu-cargo-

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Настоящий Windows-бинарь. Собрать его на Linux нельзя, поэтому единственный
  # честный способ — собирать на самой Windows.
  windows:
    name: Сборка .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable
        run: |
          rustup update stable
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: windows-cargo-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: windows-cargo-

      - run: cargo build --release

      - name: Размер бинаря
        run: |
          $f = Get-Item target/release/dialoging.exe
          "dialoging.exe — {0:N1} МБ" -f ($f.Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: dialoging-windows
          path: desktop/target/release/dialoging.exe
          if-no-files-found: error

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            target/release/dialoging.exe `
            --title "Dialoging $env:GITHUB_REF_NAME" `
            --notes "Редактор диалогов под Windows. Один файл, ставить ничего не нужно: скачай dialoging.exe и запусти."
